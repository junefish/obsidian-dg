services:
  obsidian-dg:
    image: obsidian-dg:local
    build: .
    container_name: obsidian-dg
    ports:
      - "127.0.0.1:7447:80"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - repo-data:/app/repo
      - web-content:/var/www/html
    init: true

volumes:
  repo-data:
  web-content:
